<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Can I Relax In Your House?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav>
    <a href="index.html" class="crossed-out">Work</a>
    <a href="info.html" class="crossed-out">Info</a>
  </nav>

  <main>
    <div class="section-title">
      <em class="italic-font">Can I Relax in Your House?</em><br>
      with <a href="http://www.laceyverhalen.com" target="_blank" rel="noopener noreferrer">Lacey Verhalen</a><br>
      Nord Books, Stockholm<br>
      August - October 2026
    </div>
  </main>
  
  <div class="portfolio-container">
    
    <div class="artwork-item">
        <img src="97-whos-in-goal.jpg" alt="Who's in Goal?">
        <div class="artwork-caption">
          <span class="caption-size">97 - Who’s in Goal?</span><br>
          Oil and varnish on book cover
        </div>
      </div>

</div> 

<script>
  // Target layout elements AND text-formatting elements like em, i, and .italic-font
  const textContainers = document.querySelectorAll('nav a, .section-title, .year-heading, .bio-text, .contact-info, .exhibition-section h2, .exhibition-type, .exhibition-item p, .artwork-caption, em, i, .italic-font');

  textContainers.forEach(container => {
    Array.from(container.childNodes).forEach(node => {
      // Process text nodes directly inside targeted elements safely
      if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() !== '') {
        // Splits by words while capturing spaces to preserve formatting
        const words = node.textContent.split(/(\s+)/);
        
        const spanWords = words.map(word => {
          // If it's a space or whitespace, keep it as-is without a span
          if (word.trim() === '') return word;
          // Wrap individual words in the hover-word class
          return `<span class="hover-word">${word}</span>`;
        });
        
        const placeholder = document.createElement('span');
        placeholder.innerHTML = spanWords.join('');
        node.parentNode.insertBefore(placeholder, node);
        node.parentNode.removeChild(node);
      }
    });
  });

  // Assign the random color on hover
  document.addEventListener('mouseover', function(e) {
    if (e.target.classList.contains('hover-word')) {
      const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
      e.target.style.color = randomColor;
    }
  });

  // Reset the color when moving away
  document.addEventListener('mouseout', function(e) {
    if (e.target.classList.contains('hover-word')) {
      e.target.style.color = '';
    }
  });
</script>
</body>
</html>
